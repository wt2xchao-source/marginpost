[package]
name = "agent-markdown-reviewer"
version = "0.0.1"
description = "Local-first review workspace for agent-edited Markdown"
authors = ["Tony"]
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "agent_markdown_reviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
notify = "8.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
similar = "3.2.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2.3.1"
tauri-plugin-single-instance = "2.3.4"

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
